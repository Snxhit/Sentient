<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sentient</title>
    <link rel="stylesheet" href="stylesheet.css">
  </head>
  <body>
    <div id="container">
      <canvas id="sim"></canvas>
    </div>
    <div id="tooltip"></div>
    <div class="brushPanel" id="brushPanel">
      <input type="image" src="./public/brushes/PointerBrush1.png" class="brushItem" id="pointerBrush">
      <input type="image" src="./public/brushes/EraserBrush.png" class="brushItem" id="eraserBrush">
      <input type="image" src="./public/brushes/DirtBrush.png" class="brushItem" id="dirtBrush">
      <input type="image" src="./public/brushes/HumanBrush.png" class="brushItem" id="humanBrush">
      <input type="image" src="./public/categories/SpawnEntities.png" class="brushItem" id="entitiesCategory">
      <input type="image" src="./public/brushes/FoodBrush1.png" class="brushItem" id="foodBrush">
    </div>
    <div class="timePanel" id="timePanel">
      <input type="image" src="./public/ui_controls/PauseButton.png" class="timeItem" id="pauseButton">
      <input type="image" src="./public/ui_controls/PlayButton.png" class="timeItem" id="playButton">
      <input type="image" src="./public/ui_controls/TwoXButton.png" class="timeItem" id="twoXButton">
    </div>


    <script type="module" src="main.js"></script>
  </body>
</html>
